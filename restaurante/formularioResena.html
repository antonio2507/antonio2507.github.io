<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de resena">
    <meta name="author" content="Antonio">
    <meta name="keywords" content="formulario, html, restaurante, resena">
    <link rel="icon" type="image/png" href="img/logo.png">
    <title>Formulario de Reseña</title>
</head>
<body>

<header>
    <h1>Reseña tu plato favorito</h1>
</header>

<nav>

</nav>

<main>
    <form>
        <label for="platoResena">Elija el plato:</label>
        <select id="platoResena" name="platoResena">
            <option value="plato1">Tomates rellenos con queso y salmón</option>
            <option value="plato2">Tortilla francesa rellena</option>
            <option value="plato3">Salmorejo de melocotón</option>
        </select>
        <br><br>

        <label for="nombreAutorResena">Su nombre:</label>
        <input type="text" id="nombreAutorResena" name="nombreAutorResena">
        <br><br>

        <label for="textoResena">Su reseña:</label><br>
        <textarea id="textoResena" name="textoResena" rows="5" cols="50"></textarea>
        <br><br>

        <input type="submit" value="Enviar Reseña">
    </form>
    <br><br>
</main>

<footer>
    <a href="index.html">Volver a la página anterior</a>
    © 2026
</footer>

</body>
</html>
