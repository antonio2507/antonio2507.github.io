<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de reserva">
    <meta name="author" content="Antonio">
    <meta name="keywords" content="formulario, html, restaurante, reserva">
    <link rel="icon" type="image/png" href="img/logo.png">
    <title>Formulario de Reserva</title>
</head>
<body>

<header>
    <h1>Reserva</h1>
</header>

<nav>

</nav>

<main>
    <h2>Haz una reserva</h2>
    <form action="#" method="POST">
        <label for="nombreReserva">Su nombre</label>
        <input type="text" id="nombreReserva" name="nombreReserva">
    
        <label for="numClientes">Número de clientes</label>
        <input type="number" id="numClientes" name="numClientes">
        <br><br>
    
        <label for="emailReserva">Su correo electrónico</label>
        <input type="email" id="emailReserva" name="emailReserva">
    
        <label for="tlfReserva">Su teléfono</label>
        <input type="tlf" id="tlfReserva" name="tlfReserva">
        <br><br>
    
        <label for="fechaReserva">Fecha de la reserva</label>
        <input type="date" id="fechaReserva" name="fechaReserva">
    
        <label for="horaReserva">Hora de la reserva</label>
        <input type="time" id="horaReserva" name="horaReserva">
        <br><br>
    
        <label for="mensajeReserva">Su mensaje</label><br>
        <textarea id="mensajeReserva" name="mensajeReserva" rows="4" cols="50"></textarea>
        <br><br>
    
        <input type="submit" value="SOLICITAR RESERVA">
        <p>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="">Política de privacidad</a></p>
    </form>
    <br><br>

</main>

<footer>
    <a href="index.html">Volver a la página anterior</a>
    © 2026
</footer>

</body>
</html>
