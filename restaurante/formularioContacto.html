<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto">
    <meta name="author" content="Antonio">
    <meta name="keywords" content="formulario, html, restaurante, contacto">
    <link rel="icon" type="image/png" href="img/logo.png">
    <title>Formulario de Contacto</title>
</head>
<body>

<header>
    <h1>Contacta con Nosotros</h1>
</header>

<nav>

</nav>

<main>
    <h2>Envíenos su mensaje</h2>
    <form>
        <label for="nombreContacto">Su nombre</label>
        <input type="text" id="nombreContacto" name="nombreContacto">
    
        <label for="emailContacto">Su correo electrónico</label>
        <input type="email" id="emailContacto" name="emailContacto">
    
        <label for="tlfContacto">Su teléfono</label>
        <input type="tlf" id="tlfContacto" name="tlfContacto">
        <br><br>
    
        <label for="asunto">Asunto</label><br>
        <input type="text" id="asunto" name="asunto" size="60">
        <br><br>
    
        <label for="mensajeContacto">Su mensaje</label><br>
        <textarea id="mensajeContacto" name="mensajeContacto" rows="6" cols="60" maxlength="500" placeholder="0/500"></textarea>
     <br><br>
    
        <input type="submit" value="ENVIAR">
    </form>
    <br><br>

</main>

<footer>
    <a href="index.html">Volver a la página anterior</a>
    © 2026
</footer>

</body>
</html>
